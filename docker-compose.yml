services:
  db:
    image: postgres:16
    restart: unless-stopped   # comes back on its own whenever Docker Desktop starts
    environment:
      POSTGRES_DB: caraoke
      POSTGRES_USER: caraoke
      POSTGRES_PASSWORD: caraoke
    ports:
      - "5433:5432"   # host 5433 so it never collides with a native Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
